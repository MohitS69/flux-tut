apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../base
  - webui-service.yaml

patches:
  - path: hasher-patch.yaml
    target:
      kind: Deployment
      name: hasher
  - path: redis-patch.yaml
    target:
      kind: Deployment
      name: redis
  - path: rng-patch.yaml
    target:
      kind: Deployment
      name: rng
  - path: webui-patch.yaml
    target:
      kind: Deployment
      name: webui
  - path: worker-patch.yaml
    target:
      kind: Deployment
      name: worker
