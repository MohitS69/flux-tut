apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: haproxy-kubernetes-ingress
  namespace: haproxy-controller
spec:
  interval: 1h

  install:
    createNamespace: true

  chart:
    spec:
      chart: kubernetes-ingress
      version: "1.44.0"
      sourceRef:
        kind: HelmRepository
        name: haproxytech
        namespace: flux-system
      interval: 5h

  values:
    controller:
      ingressClass: haproxy
